<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="homepage">
  <div class="app-wrap">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo.png" alt="logo">
        <div style="color:#fff; font-weight:600">Online alert system</div>
      </div>
      <div style="height:1px; background:rgba(255,255,255,0.04)"></div>
      <div style="display:flex; gap:10px; align-items:center">
        <img src="assets/avatar.png" alt="avatar" style="width:34px;height:34px;border-radius:50%">
        <div style="font-size:13px;color:#bfc9d9">User</div>
      </div>
      <nav class="nav">
        <a href="activity.html">Activities</a>
        <a href="account.html" class="active">Account</a>
        <a href="#">Messages</a>
        <a href="#">Notifications</a>
      </nav>
      <div style="flex:1"></div>
      <div style="display:flex; flex-direction:column; gap:8px">
        <a href="#" style="color:#cfcfcf; text-decoration:none">Help</a>
        <a href="index.html" style="color:#ff7b6b; text-decoration:none">Logout</a>
      </div>
    </aside>

    <main class="main">
      <div class="header-hero"></div>
      <div class="content" style="align-items:flex-start; padding-top:10px;">
        <div style="width:80%; background:white; padding:28px; border-radius:8px; box-sizing:border-box; margin: 0 auto;">
          <h2 style="margin-top:0;">Account</h2>
          <div style="display:flex; gap:12px;">
            <div style="flex:1">
              <label>First Name</label>
              <input id="firstName" type="text" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; border-radius:6px; border:1px solid #ccc">
            </div>
            <div style="flex:1">
              <label>Last Name</label>
              <input id="lastName" type="text" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; border-radius:6px; border:1px solid #ccc">
            </div>
          </div>
          <label>Email</label>
          <input id="email" type="email" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; border-radius:6px; border:1px solid #ccc">
          <label>Contact Number</label>
          <input id="contact" type="text" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; border-radius:6px; border:1px solid #ccc">
          <label>Password</label>
          <input id="password" type="password" style="width:100%; padding:10px; margin-top:6px; margin-bottom:12px; border-radius:6px; border:1px solid #ccc">
          <div style="display:flex; gap:12px; margin-top:10px">
            <button id="cancelBtn" style="padding:8px 16px; border-radius:6px; border:1px solid #3b83d2; background:white; color:#3b83d2; cursor:pointer">Cancel</button>
            <button id="saveBtn" style="padding:8px 16px; border-radius:6px; border:none; background:#2d63b0; color:white; cursor:pointer">Save</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      try {
        var u = (window.userAPI && window.userAPI.getCurrentUser()) || null;
        if (u) {
          document.getElementById('firstName').value = u.firstName || '';
          document.getElementById('lastName').value = u.lastName || '';
          document.getElementById('email').value = u.email || '';
          document.getElementById('contact').value = u.contact || '';
          document.getElementById('password').value = u.password || '';
        }
      } catch (e) { console.warn(e); }

      document.getElementById('cancelBtn').addEventListener('click', function(e){
        e.preventDefault();
        window.location.reload();
      });

      document.getElementById('saveBtn').addEventListener('click', function(e){
        e.preventDefault();
        var firstName = document.getElementById('firstName').value.trim();
        var lastName = document.getElementById('lastName').value.trim();
        var email = document.getElementById('email').value.trim();
        var contact = document.getElementById('contact').value.trim();
        var password = document.getElementById('password').value;

        if (!firstName || !email) {
          alert('Please provide at least a first name and email.');
          return;
        }

        var user = { firstName:firstName, lastName:lastName, email:email, contact:contact, password:password };
        if (window.userAPI && window.userAPI.saveCurrentUser) {
          window.userAPI.saveCurrentUser(user);
          alert('Saved');
        } else {
          localStorage.setItem('currentUser', JSON.stringify(user));
          alert('Saved (local)');
        }
      });
    });
  </script>
</body>
</html>
